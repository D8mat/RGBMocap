[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgb-mocap"
version = "1.0.1"
description = "Native Windows video motion capture, humanoid retargeting and FBX/VMD export"
license = {file = "LICENSE"}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["mocap*"]
